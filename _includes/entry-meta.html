{%- assign t = include.post.type | default: 'article' -%}
<span class="entry-type entry-type--{{ t }}">{{ site.entry_types[t] | default: t }}</span>
<time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%b %-d, %Y' }}</time>
{%- if include.reading_time %}
<span class="entry-dot">·</span>
<span>{{ include.post.content | number_of_words | divided_by: 220 | plus: 1 }} min read</span>
{%- endif %}
